# Explicit local-only sandbox. IdentityConfig rejects mixing this profile with any other profile.
lmt.identity.mode=sandbox
lmt.identity.sandbox-secret=${LMT_SANDBOX_SECRET}
lmt.identity.inbox=${LMT_SANDBOX_INBOX}
lmt.security.allowed-origins=http://localhost:3000,http://127.0.0.1:3000
server.address=127.0.0.1
