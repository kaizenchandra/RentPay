# Use only with an HTTPS public origin and independently provisioned live identity database.
lmt.identity.mode=live
lmt.identity.otp-secret=${LMT_OTP_SECRET}
lmt.security.allowed-origins=${LMT_PUBLIC_ORIGINS}
lmt.sms.twilio.account-sid=${TWILIO_ACCOUNT_SID:}
lmt.sms.twilio.auth-token=${TWILIO_AUTH_TOKEN:}
lmt.sms.twilio.messaging-service-sid=${TWILIO_MESSAGING_SERVICE_SID:}
lmt.sms.template=${LMT_APPROVED_SMS_TEMPLATE:}
lmt.email.resend.api-key=${RESEND_API_KEY:}
lmt.email.from=${LMT_EMAIL_FROM:}
lmt.identity.hourly-limit=${LMT_IDENTITY_HOURLY_LIMIT}
