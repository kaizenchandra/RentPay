name: Verify foundation slices
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: python3 scripts/traceability.py
      - run: ./mvnw -B -ntp verify
        working-directory: backend
      - run: npm ci
        working-directory: web
      - run: npm run generate && git diff --exit-code -- src/lib/api/schema.d.ts
        working-directory: web
      - run: npm run typecheck && npm run build && npm audit --audit-level=high
        working-directory: web
      - run: docker compose up -d --wait db
      - name: Start real services
        run: |
          ./scripts/run-api-local.sh > /tmp/lmt-api.log 2>&1 &
          cd web
          npm run start > /tmp/lmt-web.log 2>&1 &
      - name: Wait for readiness
        run: |
          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8080/actuator/health && curl --fail --silent -o /dev/null http://127.0.0.1:3000/pricing; then exit 0; fi
            sleep 2
          done
          exit 1
      - run: npx playwright install --with-deps chromium && npm run test:e2e && node tests/recovery.mjs && node tests/foundation-recovery.mjs
        working-directory: web
      - if: always()
        run: docker compose stop
